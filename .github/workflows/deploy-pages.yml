name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-publish from the Actions tab without pushing a commit.
  workflow_dispatch:

# GITHUB_TOKEN permissions needed to publish a Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two publishes at once; let a newer commit supersede a queued one,
# but don't cancel a deploy that is already mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The repo carries ~1 GB of image history; only HEAD is needed.
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build site
        run: pnpm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload build output
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/tara-ev/dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
