# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# Any npm package version must have been published for at least 1 day (1440
# minutes) before pnpm will install it. Malicious npm releases are usually
# discovered and pulled within hours, so a 1-day delay is a strong safety
# buffer.
#
# DO NOT DISABLE THIS SETTING. Removing it or setting it to 0 leaves the
# workspace open to supply-chain attacks, the #1 vector for npm compromises.
#
# If you genuinely need a package before its 1-day window has passed (e.g. an
# urgent security fix), add it to a `minimumReleaseAgeExclude` list here and
# remove the exclusion once the window has passed.
# ============================================================================
minimumReleaseAge: 1440

packages:
  - artifacts/tara-ev

catalog:
  '@types/node': ^25.3.3
  '@types/react': ^19.2.0
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  react: 19.1.0
  react-dom: 19.1.0
  vite: ^7.3.2

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # drizzle-kit pulls an older, vulnerable esbuild through @esbuild-kit;
  # pin both so only the patched esbuild is ever installed.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
